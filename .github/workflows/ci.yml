name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------- LINUX ----------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Configure CMake
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cmake -B build -D SOLVER_VERSION="$VERSION" -DCPACK_GENERATOR="DEB;RPM;TGZ;ZIP"
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        run: cmake --build build --target package
      - name: List Linux packages
        run: ls -la build/*.{deb,rpm,tar.gz,zip} 2>/dev/null || true
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.zip
          if-no-files-found: error

  # ---------- WINDOWS (MSI) ----------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WiX Toolset
        run: choco install wixtoolset
      - name: Configure CMake
        shell: pwsh
        run: |
          $VERSION = "$env:GITHUB_REF_NAME".TrimStart('v')
          cmake -B build -D SOLVER_VERSION="$VERSION" -DCPACK_GENERATOR="WIX;ZIP"
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        run: cmake --build build --target package
      - name: List Windows packages
        run: Get-ChildItem -Path build\*.msi
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: build/*.msi
          if-no-files-found: error

  # ---------- MACOS (DMG) ----------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install create-dmg (for DragNDrop generator)
        run: brew install create-dmg
      - name: Configure CMake
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cmake -B build -D SOLVER_VERSION="$VERSION" -DCPACK_GENERATOR="DragNDrop;ZIP"
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        run: cmake --build build --target package
      - name: List macOS packages
        run: ls -la build/*.dmg 2>/dev/null || true
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: build/*.dmg
          if-no-files-found: error

  # ---------- RELEASE ----------
  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: List all downloaded files
        run: ls -R
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-packages/*.deb
            linux-packages/*.rpm
            linux-packages/*.tar.gz
            linux-packages/*.zip
            windows-packages/*.msi
            macos-packages/*.dmg
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for version ${{ github.ref_name }}.
            Contains binary packages for Linux (DEB, RPM), Windows (MSI), macOS (DMG), and source archives (TGZ, ZIP).
          draft: false
          prerelease: false
