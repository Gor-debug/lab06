name: Build and Release

on:
  push:
    tags:
      - 'v*'            

permissions:
  contents: write       
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install RPM build tools (нужно для создания .rpm)
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Configure CMake
        run: |
          VERSION=${GITHUB_REF_NAME#v}   # из тега v1.0.5 получаем 1.0.5
          cmake -B build -D SOLVER_VERSION="$VERSION"

      - name: Build
        run: cmake --build build --config Release

      - name: Package (создание .deb, .rpm, .tar.gz, .zip, .msi, .dmg)
        # Здесь CPack сам создаст все пакеты, для которых есть генераторы
        run: cmake --build build --target package

      - name: List generated packages (Linux)
        run: ls -la build/*.{deb,rpm,tar.gz,zip} 2>/dev/null || true

      - name: Upload Linux artifacts (сохраняем для финального релиза)
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        shell: pwsh
        run: |
          $VERSION = "$env:GITHUB_REF_NAME".TrimStart('v')
          cmake -B build -D SOLVER_VERSION="$VERSION"

      - name: Build
        run: cmake --build build --config Release

      - name: Package (создание .msi и других пакетов, поддерживаемых на Windows)
        run: cmake --build build --target package

      - name: List Windows packages (MSI)
        run: Get-ChildItem -Path build\*.msi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: build/*.msi
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cmake -B build -D SOLVER_VERSION="$VERSION"

      - name: Build
        run: cmake --build build --config Release

      - name: Package (создание .dmg)
        run: cmake --build build --target package

      - name: List macOS packages (DMG)
        run: ls -la build/*.dmg 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: build/*.dmg
          if-no-files-found: error

  create-release:
    needs: [build-linux, build-windows, build-macos]   # Ждём завершения всех сборок
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts (скачиваем пакеты с трёх платформ)
        uses: actions/download-artifact@v4

      - name: List all downloaded files (для отладки)
        run: ls -R

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-packages/*.deb
            linux-packages/*.rpm
            linux-packages/*.tar.gz
            linux-packages/*.zip
            windows-packages/*.msi
            macos-packages/*.dmg
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for version ${{ github.ref_name }}.
            Contains binary packages for Linux (DEB, RPM), Windows (MSI), macOS (DMG), and source archives (TGZ, ZIP).
          draft: false
          prerelease: false
