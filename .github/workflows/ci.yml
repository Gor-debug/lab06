name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Configure CMake
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cmake -B build -D SOLVER_VERSION="$VERSION"
      - name: Build
        run: cmake --build build --config Release
      - name: Package with CPack (DEB, RPM, TGZ, ZIP)
        run: |
          cd build
          cpack -G DEB
          cpack -G RPM
          cpack -G TGZ
          cpack -G ZIP
          cd ..
      - name: List Linux packages
        run: ls -la build/*.{deb,rpm,tar.gz,zip} 2>/dev/null || true
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: |
          $VERSION = "$env:GITHUB_REF_NAME".TrimStart('v')
          cmake -B build -D SOLVER_VERSION="$VERSION"
      - name: Build
        run: cmake --build build --config Release
      - name: Create ZIP archive manually
        run: |
          Compress-Archive -Path build/Release/* -DestinationPath solverapp-${{ github.ref_name }}-win64.zip
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: solverapp-${{ github.ref_name }}-win64.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cmake -B build -D SOLVER_VERSION="$VERSION"
      - name: Build
        run: cmake --build build --config Release
      - name: Create ZIP archive manually
        run: |
          cd build
          zip -r ../solverapp-${{ github.ref_name }}-macos.zip Release/solver
          cd ..
      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: solverapp-${{ github.ref_name }}-macos.zip
          if-no-files-found: error

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: List all downloaded files
        run: ls -R
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-packages/*.deb
            linux-packages/*.rpm
            linux-packages/*.tar.gz
            linux-packages/*.zip
            windows-packages/*.zip
            macos-packages/*.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for version ${{ github.ref_name }}.
            Contains packages for Linux (DEB, RPM, TGZ, ZIP), Windows (ZIP), macOS (ZIP).
          draft: false
          prerelease: false
